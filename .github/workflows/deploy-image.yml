name: Deploy Images to Docker Hub

env:
  DOTNET_VERSION: '6.0.x'

on:
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/playwright-service-ts/**
  workflow_dispatch:

jobs:
      push-api-image:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: './apps/api'
        steps:
          - name: 'Checkout GitHub Action'
            uses: actions/checkout@main

          - name: 'Set up Docker Buildx'
            uses: docker/setup-buildx-action@v3

          - name: 'Login to Docker Hub'
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

          - name: 'Build and Push API Image'
            uses: docker/build-push-action@v6
            with:
              context: ./apps/api
              push: true
              tags: ${{ vars.DOCKER_IMAGE_NAME }}:latest
              cache-from: type=registry,ref=${{ vars.DOCKER_IMAGE_NAME }}:buildcache
              cache-to: type=registry,ref=${{ vars.DOCKER_IMAGE_NAME }}:buildcache,mode=max

      push-playwright-image:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: './apps/playwright-service-ts'
        steps:
          - name: 'Checkout GitHub Action'
            uses: actions/checkout@main

          - name: 'Set up Docker Buildx'
            uses: docker/setup-buildx-action@v3

          - name: 'Login to Docker Hub'
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

          - name: 'Build and Push Playwright Image'
            uses: docker/build-push-action@v6
            with:
              context: ./apps/playwright-service-ts
              push: true
              tags: ${{ vars.DOCKER_IMAGE_NAME }}-playwright-ts:latest
              cache-from: type=registry,ref=${{ vars.DOCKER_IMAGE_NAME }}-playwright-ts:buildcache
              cache-to: type=registry,ref=${{ vars.DOCKER_IMAGE_NAME }}-playwright-ts:buildcache,mode=max